site_description: 'Resources for teaching Scratch to CoderDojo Twin Cities students.'
site_author: 'Dan McCreary'
site_url: 'https://dmccreary.github.io/scratch/'
repo_name: 'Scratch'
repo_url: 'https://github.com/dmccreary/scratch'
edit_uri: 'blob/master/docs'
theme:
  name: material
  logo: img/coderdojo-logo.png
  favicon: img/favicon.png
  palette:
    primary: '#642580'
    accent: '#41BAC1'
  feature:
    tabs: true
  custom_dir: 'theme'
  include_sidebar: true
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true
  - codehilite:
      linenums: true
plugins:
    - search
extra_css:
  - stylesheets/extra.css
  - stylesheets/mascot.css
  - stylesheets/scratchblocks.css
extra_javascript:
  - https://cdn.jsdelivr.net/npm/scratchblocks@3.7.1/build/scratchblocks.min.js
  - js/scratchblocks-init.js
