<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Algorithm Design Flowchart using Mermaid</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <script src="algorithm-design-flow.js"></script>
</head>
<body>
    <main>
        <div class="title">Algorithm Design Flowchart</div>
        <!-- the flowchart is drawn into this container by algorithm-design-flow.js -->
        <div class="chart-wrap">
            <div id="chart" class="chart" aria-label="Flowchart of the five moves of algorithm design"></div>
        </div>
        <div id="infobox" class="infobox" aria-live="polite">
            <div class="info-title">Click a box</div>
            <div class="info-body">
                <p class="info-prompt">Click any box in the chart to see what happens at that move.</p>
            </div>
        </div>
    </main>
    <br/>
    <a href=".">Back to Lesson Plan</a>
</body>
</html>
